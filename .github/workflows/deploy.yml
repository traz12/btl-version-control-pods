name: Build & Deploy

# One branch, one environment, one image, one namespace:
#   dev  -> breaker-dev   -> namespace breaker-dev
#   test -> breaker-test  -> namespace breaker-test
#   main -> breaker-prod  -> namespace breaker-prod
on:
  push:
    branches: [dev, test, main]
  workflow_dispatch:

# Two pushes to the same branch must not deploy on top of each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Work out the environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.env }}
      image_name: ${{ steps.env.outputs.image_name }}
      namespace: ${{ steps.env.outputs.namespace }}
      version: ${{ steps.env.outputs.version }}
      short_sha: ${{ steps.env.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: env
        run: |
          ENV=$(bash scripts/env_for_branch.sh "${GITHUB_REF_NAME}")
          {
            echo "env=$ENV"
            echo "image_name=breaker-$ENV"
            echo "namespace=breaker-$ENV"
            echo "version=$(cat VERSION)"
            echo "short_sha=${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          echo "Branch ${GITHUB_REF_NAME} deploys to the $ENV environment."

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.env }}
    needs: [resolve]
    runs-on: ubuntu-latest
    # The GitHub environment of the same name. Add reviewers to it in the
    # repository settings and that environment will wait for an approval.
    environment:
      name: ${{ needs.resolve.outputs.env }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPO: ${{ vars.AR_REPO }}
      CLUSTER: ${{ vars.GKE_CLUSTER }}
      ENVIRONMENT: ${{ needs.resolve.outputs.env }}
      NAMESPACE: ${{ needs.resolve.outputs.namespace }}
      IMAGE_NAME: ${{ needs.resolve.outputs.image_name }}
      APP_VERSION: ${{ needs.resolve.outputs.version }}
      SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Name the image
        id: image
        run: |
          BASE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}"
          # The pod always runs the commit tag, so every push really does roll out.
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "deployed=$BASE:sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "Image: $BASE:sha-$SHORT_SHA"

      - name: Build
        run: |
          docker build \
            --build-arg ENVIRONMENT="$ENVIRONMENT" \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_SHA="$SHORT_SHA" \
            --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${{ steps.image.outputs.base }}:sha-$SHORT_SHA" \
            -t "${{ steps.image.outputs.base }}:v$APP_VERSION" \
            -t "${{ steps.image.outputs.base }}:latest" \
            .

      - name: Push
        run: docker push --all-tags "${{ steps.image.outputs.base }}"

      - name: Connect to the cluster
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Deploy
        run: |
          kubectl apply -f "k8s/${ENVIRONMENT}/namespace.yaml"
          IMAGE="${{ steps.image.outputs.deployed }}" envsubst '${IMAGE}' \
            < "k8s/${ENVIRONMENT}/deployment.yaml" | kubectl apply -f -
          kubectl apply -f "k8s/${ENVIRONMENT}/service.yaml"
          kubectl rollout status deployment/breaker -n "$NAMESPACE" --timeout=300s
          kubectl get pods -n "$NAMESPACE" -o wide

      - name: Check the pods answer
        run: |
          # Ask the service from inside the cluster, so a broken build fails here
          # and not in front of a user.
          kubectl run "smoke-$SHORT_SHA" -n "$NAMESPACE" --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 --quiet -- \
            curl -sS --fail --max-time 10 http://breaker.${NAMESPACE}.svc.cluster.local/version

      - name: What went wrong
        if: failure()
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide || true
          kubectl describe deployment/breaker -n "$NAMESPACE" | tail -30 || true
          kubectl logs -n "$NAMESPACE" -l app=breaker --tail=50 || true
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp | tail -20 || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to \`$ENVIRONMENT\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Image | \`${{ steps.image.outputs.deployed }}\` |"
            echo "| Namespace | \`$NAMESPACE\` |"
            echo "| Cluster | \`$CLUSTER\` (\`$REGION\`) |"
          } >> "$GITHUB_STEP_SUMMARY"
